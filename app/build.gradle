    defaultConfig {
        applicationId 'tw.stock.kdscanner'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '1.6'

        buildConfigField 'String', 'SITE_URL',
            '"https://lbabqwezz94jgfha6giojm.streamlit.app/"'
